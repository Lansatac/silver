# The compiler's own shape: a root with no modules that describes library packages and two that are
# programs, and lists a package with a silver.toml of its own.
name = "tool"

[[package]]
name = "tool.ast"
path = "ast"

[[package]]
name = "tool.syntax"
path = "syntax"
uses = ["tool.ast"]

[[package]]
name = "tool.compiler"
path = "compiler"
source = "source"
uses = ["tool.syntax", "tool.ast", "geometry"]

[[package]]
name = "tool.frontend"
path = "frontend"

[[package]]
path = "../uses-path/geometry"
