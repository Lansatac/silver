# The compiler's own shape: a root with no modules that describes library packages, two that are
# programs and one whose tests silver test leaves out, and lists a package with a silver.toml of its
# own outside it, whose tests it opts in.
name = "tool"

[[package]]
name = "tool.ast"
path = "ast"

[[package]]
name = "tool.syntax"
path = "syntax"
uses = ["tool.ast"]

[[package]]
name = "tool.compiler"
path = "compiler"
source = "source"
uses = ["tool.syntax", "tool.ast", "geometry"]

[[package]]
name = "tool.frontend"
path = "frontend"

[[package]]
name = "tool.docs"
path = "docs"
test = false

[[package]]
path = "../uses-path/geometry"
test = true
