# Runs the whole suite (runTests) on Linux and Windows.
# Linux runs it in the `build` stage of the dev container's Dockerfile, which the dev container is
# built on, so both use the same pinned dmd, clang and redub. Windows takes dmd's version and
# redub's commit from the same Dockerfile.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          target: build
          tags: silver-build:ci
          load: true
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      - name: Cache fetched dub packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/home/.dub/packages
          key: dub-linux-${{ hashFiles('dub.selections.json', '**/dub.json') }}
          restore-keys: dub-linux-

      # Runs as the runner's user, who owns the checkout.
      # The in-memory /tmp with exec is the one the dev container sets up (devcontainer.json).
      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/ci-home \
            -v "$RUNNER_TEMP/home:/ci-home" \
            -v "$GITHUB_WORKSPACE:/code" \
            -w /code \
            --tmpfs /tmp:rw,exec,mode=1777,size=8g \
            silver-build:ci ./runTests.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Read pins from the dev container's Dockerfile
        id: pins
        shell: bash
        run: |
          echo "dmd=$(sed -n 's/^ARG DMD_VERSION=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "redub=$(sed -n 's/^ARG REDUB_COMMIT=//p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"

      # redub runs several dmd processes at once, each taking gigabytes, and Windows refuses memory past
      # RAM plus the page file, where Linux overcommits. With the runner's own page file, dmd crashed
      # with an access violation building the root.
      - name: Enlarge the page file
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "D:"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-${{ steps.pins.outputs.dmd }}

      # runTests.ps1 looks for ~\redub\build\redub.exe.
      - name: Cache redub
        id: redub-cache
        uses: actions/cache@v6
        with:
          path: ~/redub/build
          key: redub-windows-${{ steps.pins.outputs.redub }}-dmd-${{ steps.pins.outputs.dmd }}

      - name: Build redub
        if: steps.redub-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/Lansatac/redub.git "$HOME/redub"
          git -C "$HOME/redub" checkout --quiet ${{ steps.pins.outputs.redub }}
          Push-Location "$HOME/redub"
          dub build --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Cache fetched dub packages
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dub/packages
          key: dub-windows-${{ hashFiles('dub.selections.json', '**/dub.json') }}
          restore-keys: dub-windows-

      # As a release does: silverc, in out, and the test executables, in build, find clang and lld-link
      # in llvm beside themselves before the PATH. The image ships LLVM.
      - name: Bundle LLVM's clang and lld-link
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          $llvm = if ($clang) { Split-Path $clang.Source } else { 'C:\Program Files\LLVM\bin' }
          foreach ($dir in 'out\llvm', 'build\llvm') {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "$llvm\clang.exe", "$llvm\lld-link.exe" $dir
          }
          out\llvm\clang.exe --version
          Get-ChildItem out\llvm | Format-Table Name, Length
          # Any DLL here that Windows doesn't have would have to be bundled too.
          foreach ($exe in 'clang', 'lld-link') {
            "$exe imports:"
            & "$llvm\llvm-readobj.exe" --coff-imports "out\llvm\$exe.exe" | Select-String 'Name:'
          }
          dmd --version

      # One dmd at a time: in parallel, with each taking gigabytes, dmd crashed and then stalled on 16 GB.
      # Without clang on the PATH, so programs build only with the bundled tools.
      - name: Test
        env:
          SILVER_REDUB_PARALLEL: "no"
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'clang.exe')) }) -join ';'
          if (Get-Command clang -ErrorAction SilentlyContinue) { throw 'clang is still on the PATH' }
          ./runTests.ps1
